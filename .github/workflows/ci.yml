name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `verify` runs unit tests (surefire) and the Testcontainers integration tests (failsafe).
      # ubuntu-latest ships Docker, which Testcontainers uses to start Postgres and Redis.
      - name: Build and run all tests
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -t claimflow:ci .
      - name: Build web image
        run: docker build -t claimflow-web:ci frontend
