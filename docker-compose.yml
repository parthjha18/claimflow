# `docker compose up --build` starts Postgres, Redis, the API (http://localhost:8080) and the web UI (http://localhost:3000)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimflow
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: claimflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimflow -d claimflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/claimflow
      DB_USER: claimflow
      DB_PASSWORD: claimflow
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: demo          # loads the demo organisation; remove for a clean database
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
